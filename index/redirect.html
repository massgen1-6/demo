<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Website - YouTube Player</title>
    <!-- Step out of index/ and look into style/ -->
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <div class="player-container">
        <h1>YouTube Player</h1>
        <p>Enter a song name, video link, or specific video ID to play it right here!</p>
        
        <div class="input-group">
            <input type="text" id="song-input" placeholder="Enter song name, link, or ID..." value="https://youtube.com">
            <button id="search-btn">Play Video</button>
        </div>

        <div class="video-wrapper">
            <div id="player"></div>
        </div>
        
        <br>
        <!-- Step out of index/ to hit root demo.html -->
        <a href="../demo.html" class="back-link">← Go Back Home</a>
    </div>

    <!-- Step out of index/ and look into script/ -->
    <script src="../script/script.js"></script>
</body>
</html>
